  <!-- ================= SIMULATION LOGIC ================= -->
  <script>
    lucide.createIcons();

    const canvas = document.getElementById('blossomCanvas');
    const ctx = canvas.getContext('2d');

    const shimmerCanvas = document.getElementById('shimmerCanvas');
    const shimmerCtx = shimmerCanvas.getContext('2d');

    const ambientGlow = document.getElementById('ambientGlow');

    let width = 0;
    let height = 0;

    // Simulation Configuration
    const config = {
      blossomCount: 42,
      shimmerCount: 70,
      speedFactor: 1.0,
      shimmerFactor: 1.4,
      mouseRepelRadius: 190,
      swirlForce: 1.6,
      isVortexActive: true,
      windX: 0.35,
      windY: 0.45,
      activePalette: 'velvetBurgundy'
    };

    // Color Profiles for Fruit-Infused Botanical Blossoms & Petals
    const palettes = {
      velvetBurgundy: {
        glow: 'rgba(217, 27, 114, 0.45)',
        core: '#ffd299',
        petals: [
          { fill: '#ff80bf', stroke: '#d91b72', shadow: '#5a0a2f' },
          { fill: '#f54298', stroke: '#8f174c', shadow: '#3d061f' },
          { fill: '#ab225e', stroke: '#5a0a2f', shadow: '#230312' },
          { fill: '#ffd6ea', stroke: '#d91b72', shadow: '#750e3d' }
        ],
        sparkleColors: ['#ff80bf', '#f54298', '#ffd299', '#ff99cc', '#f5b567']
      },
      electricFuchsia: {
        glow: 'rgba(245, 66, 152, 0.65)',
        core: '#ffffff',
        petals: [
          { fill: '#ffffff', stroke: '#ff80bf', shadow: '#d91b72' },
          { fill: '#ff66b2', stroke: '#f54298', shadow: '#8f174c' },
          { fill: '#f54298', stroke: '#b80f5c', shadow: '#5a0a2f' },
          { fill: '#ffe6f2', stroke: '#ff80bf', shadow: '#d91b72' }
        ],
        sparkleColors: ['#ffffff', '#ff80bf', '#f54298', '#ffcce6']
      },
      wildMulberry: {
        glow: 'rgba(171, 34, 94, 0.55)',
        core: '#f5b567',
        petals: [
          { fill: '#ab225e', stroke: '#750e3d', shadow: '#230312' },
          { fill: '#750e3d', stroke: '#3d061f', shadow: '#14020a' },
          { fill: '#d91b72', stroke: '#5a0a2f', shadow: '#3d061f' },
          { fill: '#e6609e', stroke: '#8f174c', shadow: '#230312' }
        ],
        sparkleColors: ['#ab225e', '#d91b72', '#ff80bf', '#ffd299']
      },
      goldenCassis: {
        glow: 'rgba(229, 155, 59, 0.55)',
        core: '#ffeed6',
        petals: [
          { fill: '#fce3c3', stroke: '#f5b567', shadow: '#750e3d' },
          { fill: '#f54298', stroke: '#e59b3b', shadow: '#5a0a2f' },
          { fill: '#8f174c', stroke: '#ffd299', shadow: '#230312' },
          { fill: '#ff80bf', stroke: '#f5b567', shadow: '#5a0a2f' }
        ],
        sparkleColors: ['#ffd299', '#f5b567', '#f54298', '#ffe6cc']
      }
    };

    // Cursor Tracking
    const mouse = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      targetX: window.innerWidth / 2,
      targetY: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      isDown: false
    };

    // ================= PLUM / CHERRY BLOSSOM & CURVED PETAL CLASS =================
    class FruitBlossomElement {
      constructor(isInitial = false) {
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        this.x = isInitial ? Math.random() * width : Math.random() * width * 1.3 - width * 0.15;
        this.y = isInitial ? Math.random() * height : -80 - Math.random() * 80;

        // Either a full 5-petal cherry/plum blossom or an individual voluptuous curved petal
        this.isFullBlossom = Math.random() > 0.48;

        this.depth = 0.45 + Math.random() * 0.95;
        this.baseSize = (this.isFullBlossom ? 13 + Math.random() * 14 : 9 + Math.random() * 11) * this.depth;
        this.size = this.baseSize;

        // 3D tumble & flutter
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.026;
        this.flip = Math.random() * Math.PI;
        this.flipSpeed = 0.012 + Math.random() * 0.026;

        this.vx = (0.2 + Math.random() * 0.65) * this.depth;
        this.vy = (0.4 + Math.random() * 0.85) * this.depth;

        this.opacity = (0.6 + Math.random() * 0.38) * (this.depth > 1 ? 0.96 : 0.82);
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.016 + Math.random() * 0.022;

        this.updateColor();
      }

      updateColor() {
        const pal = palettes[config.activePalette];
        this.colorSet = pal.petals[Math.floor(Math.random() * pal.petals.length)];
        this.coreColor = pal.core;
      }

      update() {
        this.swayPhase += this.swaySpeed * config.speedFactor;
        this.angle += this.angularSpeed * config.speedFactor;
        this.flip += this.flipSpeed * config.speedFactor;

        const sway = Math.sin(this.swayPhase) * (1.35 * this.depth);
        this.x += (this.vx * config.speedFactor + config.windX + sway);
        this.y += (this.vy * config.speedFactor + config.windY);

        // Distance to cursor
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.mouseRepelRadius) {
          const normDist = (1 - dist / config.mouseRepelRadius);

          if (config.isVortexActive) {
            // Magnetic fruity vortex around cursor
            const angle = Math.atan2(dy, dx);
            const tangentAngle = angle + Math.PI / 2;
            const push = normDist * 4.2 * this.depth;
            const swirl = normDist * 3.2 * this.depth * config.swirlForce;

            this.x += Math.cos(angle) * push + Math.cos(tangentAngle) * swirl;
            this.y += Math.sin(angle) * push + Math.sin(tangentAngle) * swirl;
            this.angle += 0.06 * normDist;
          } else {
            // Gentle drift displacement
            const force = normDist * 4.8 * this.depth;
            const angle = Math.atan2(dy, dx);
            this.x += Math.cos(angle) * force;
            this.y += Math.sin(angle) * force;
          }
        }

        // Screen boundary wrapping
        if (this.y > height + 90 || this.x > width + 140 || this.x < -140) {
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        const verticalFlip = Math.sin(this.flip);
        c.scale(1, Math.abs(verticalFlip) < 0.12 ? 0.12 : verticalFlip);

        c.globalAlpha = this.opacity;

        if (this.isFullBlossom) {
          // ================= 5-PETAL PLUM / CHERRY BLOSSOM =================
          const numPetals = 5;
          const petalLength = this.size;
          const petalWidth = this.size * 0.58;

          c.shadowColor = palettes[config.activePalette].glow;
          c.shadowBlur = 12 * this.depth;

          for (let p = 0; p < numPetals; p++) {
            c.save();
            c.rotate((p * Math.PI * 2) / numPetals);

            // Ripe curved petal with gentle notched top
            c.beginPath();
            c.moveTo(0, 0);
            c.bezierCurveTo(petalWidth * 0.6, -petalLength * 0.3, petalWidth, -petalLength * 0.75, petalWidth * 0.2, -petalLength);
            c.quadraticCurveTo(0, -petalLength * 0.9, -petalWidth * 0.2, -petalLength);
            c.bezierCurveTo(-petalWidth, -petalLength * 0.75, -petalWidth * 0.6, -petalLength * 0.3, 0, 0);
            c.closePath();

            // Fruit nectar gradient (wine core to vibrant fuchsia rim)
            const grad = c.createLinearGradient(0, 0, 0, -petalLength);
            grad.addColorStop(0, this.colorSet.shadow);
            grad.addColorStop(0.4, this.colorSet.stroke);
            grad.addColorStop(1, this.colorSet.fill);

            c.fillStyle = grad;
            c.fill();

            // Inner petal vein
            c.beginPath();
            c.moveTo(0, 0);
            c.quadraticCurveTo(petalWidth * 0.05, -petalLength * 0.45, 0, -petalLength * 0.78);
            c.strokeStyle = this.colorSet.fill;
            c.lineWidth = 0.6;
            c.stroke();

            c.restore();
          }

          // Stamens & Golden/Champagne Pistil Center
          c.beginPath();
          c.arc(0, 0, this.size * 0.18, 0, Math.PI * 2);
          c.fillStyle = this.coreColor;
          c.shadowColor = this.coreColor;
          c.shadowBlur = 10;
          c.fill();

          // Micro stamen dots
          for (let s = 0; s < 6; s++) {
            const rad = (s * Math.PI) / 3;
            const dist = this.size * 0.28;
            c.beginPath();
            c.arc(Math.cos(rad) * dist, Math.sin(rad) * dist, 1.2, 0, Math.PI * 2);
            c.fillStyle = '#fff0f8';
            c.fill();
          }

        } else {
          // ================= SINGLE FALLING DECADENT PETAL =================
          c.beginPath();
          c.moveTo(0, -this.size * 0.95);
          c.bezierCurveTo(this.size * 0.85, -this.size * 0.6, this.size * 0.8, this.size * 0.65, 0, this.size);
          c.bezierCurveTo(-this.size * 0.8, this.size * 0.65, -this.size * 0.85, -this.size * 0.6, 0, -this.size * 0.95);
          c.closePath();

          const grad = c.createLinearGradient(-this.size * 0.4, -this.size * 0.8, this.size * 0.4, this.size * 0.8);
          grad.addColorStop(0, '#ffe6f2');
          grad.addColorStop(0.35, this.colorSet.fill);
          grad.addColorStop(0.85, this.colorSet.stroke);
          grad.addColorStop(1, this.colorSet.shadow);

          c.fillStyle = grad;
          c.shadowColor = this.colorSet.shadow;
          c.shadowBlur = 10 * this.depth;
          c.fill();

          // Delicate vein
          c.beginPath();
          c.moveTo(0, -this.size * 0.7);
          c.quadraticCurveTo(this.size * 0.08, 0, 0, this.size * 0.78);
          c.strokeStyle = '#ffe6f2';
          c.lineWidth = 0.55;
          c.stroke();
        }

        c.restore();
      }
    }

    // ================= MAGENTA SHIMMER & NECTAR MICRO-ORBS =================
    class ShimmerDrop {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 0.8 + Math.random() * 3.0;
        this.alpha = 0.25 + Math.random() * 0.75;
        this.pulse = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.02 + Math.random() * 0.045;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = -0.28 - Math.random() * 0.55; // Ascending effervescence

        const pal = palettes[config.activePalette];
        this.color = pal.sparkleColors[Math.floor(Math.random() * pal.sparkleColors.length)];
      }

      update() {
        this.pulse += this.pulseSpeed * config.shimmerFactor;
        this.y += this.vy * config.shimmerFactor;
        this.x += this.vx * config.shimmerFactor;

        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 110) {
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * 1.9;
          this.y += Math.sin(angle) * 1.9;
        }

        if (this.y < -20 || this.x < -10 || this.x > width + 10) {
          this.reset();
          this.y = height + 10;
        }
      }

      draw(c) {
        const curAlpha = Math.max(0, (Math.sin(this.pulse) * 0.5 + 0.5) * this.alpha);
        c.save();
        c.globalAlpha = curAlpha;
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 10;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // ================= INTERACTIVE CURSOR SPARKLE TRAIL =================
    const stardustTrail = [];
    function addStardust(x, y, count = 1) {
      const pal = palettes[config.activePalette];
      for (let i = 0; i < count; i++) {
        if (stardustTrail.length > 70) stardustTrail.shift();
        stardustTrail.push({
          x: x + (Math.random() - 0.5) * 26,
          y: y + (Math.random() - 0.5) * 26,
          radius: 1.2 + Math.random() * 3.0,
          color: pal.sparkleColors[Math.floor(Math.random() * pal.sparkleColors.length)],
          life: 1.0,
          decay: 0.024 + Math.random() * 0.026
        });
      }
    }

    let blossoms = [];
    let shimmers = [];

    function syncBlossomCount() {
      if (blossoms.length < config.blossomCount) {
        while (blossoms.length < config.blossomCount) {
          blossoms.push(new FruitBlossomElement(false));
        }
      } else if (blossoms.length > config.blossomCount) {
        blossoms.splice(config.blossomCount);
      }
    }

    function resize() {
      width = canvas.width = shimmerCanvas.width = window.innerWidth;
      height = canvas.height = shimmerCanvas.height = window.innerHeight;

      blossoms = Array.from({ length: config.blossomCount }, () => new FruitBlossomElement(true));
      shimmers = Array.from({ length: config.shimmerCount }, () => new ShimmerDrop());
    }

    // ================= MAIN RENDER LOOP =================
    function render() {
      mouse.vx = mouse.targetX - mouse.x;
      mouse.vy = mouse.targetY - mouse.y;
      mouse.x += mouse.vx * 0.1;
      mouse.y += mouse.vy * 0.1;

      // Update burgundy/fuchsia ambient background glow
      if (ambientGlow) {
        const xPercent = (mouse.x / width) * 100;
        const yPercent = (mouse.y / height) * 100;
        ambientGlow.style.setProperty('--mouse-x', `${xPercent}%`);
        ambientGlow.style.setProperty('--mouse-y', `${yPercent}%`);
      }

      ctx.clearRect(0, 0, width, height);

      // Render plum blossoms & curved petals
      for (let i = 0; i < blossoms.length; i++) {
        blossoms[i].update();
        blossoms[i].draw(ctx);
      }

      // Render ascending shimmer droplets
      for (let i = 0; i < shimmers.length; i++) {
        shimmers[i].update();
        shimmers[i].draw(ctx);
      }

      // Render cursor particle trail
      shimmerCtx.clearRect(0, 0, width, height);
      for (let i = stardustTrail.length - 1; i >= 0; i--) {
        const pt = stardustTrail[i];
        pt.life -= pt.decay;
        if (pt.life <= 0) {
          stardustTrail.splice(i, 1);
          continue;
        }

        shimmerCtx.save();
        shimmerCtx.globalAlpha = pt.life * 0.95;
        shimmerCtx.fillStyle = pt.color;
        shimmerCtx.shadowColor = pt.color;
        shimmerCtx.shadowBlur = 12;
        shimmerCtx.beginPath();
        shimmerCtx.arc(pt.x, pt.y, pt.radius * pt.life, 0, Math.PI * 2);
        shimmerCtx.fill();
        shimmerCtx.restore();
      }

      requestAnimationFrame(render);
    }

    // ================= POINTER & TOUCH INTERACTIONS =================
    function handlePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.targetX = clientX;
      mouse.targetY = clientY;

      addStardust(clientX, clientY, 1);

      if (mouse.isDown) {
        addStardust(clientX, clientY, 2);
      }
    }

    window.addEventListener('mousemove', handlePointer, { passive: true });
    window.addEventListener('touchmove', handlePointer, { passive: true });

    // Click/Tap to burst floral elements & stardust
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ambientPopover, #toggleControlsBtn')) return;
      mouse.isDown = true;
      burstAt(e.clientX, e.clientY, 9);
    });

    window.addEventListener('mouseup', () => { mouse.isDown = false; });

    function burstAt(x, y, amount = 10) {
      addStardust(x, y, 18);
      for (let i = 0; i < amount; i++) {
        const b = new FruitBlossomElement(false);
        b.x = x + (Math.random() - 0.5) * 50;
        b.y = y + (Math.random() - 0.5) * 50;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.8 + Math.random() * 5.8;
        b.vx = Math.cos(angle) * speed;
        b.vy = Math.sin(angle) * speed;
        blossoms.push(b);
      }
      if (blossoms.length > config.blossomCount + 30) {
        blossoms.splice(0, amount);
      }
    }

    // ================= CONTROLS LOGIC =================
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const popover = document.getElementById('ambientPopover');
    const closeBtn = document.getElementById('closeControlsBtn');

    const petalSpeedInput = document.getElementById('petalSpeed');
    const petalDensityInput = document.getElementById('petalDensity');
    const sparkleIntensityInput = document.getElementById('sparkleIntensity');
    const toggleSwirlBtn = document.getElementById('toggleSwirlBtn');
    const scatterBtn = document.getElementById('scatterPetalsBtn');
    const paletteButtons = document.querySelectorAll('.palette-btn');

    function toggleMenu(show) {
      if (show) {
        popover.classList.remove('hidden');
        requestAnimationFrame(() => {
          popover.classList.remove('scale-95', 'opacity-0');
          popover.classList.add('scale-100', 'opacity-100');
        });
      } else {
        popover.classList.remove('scale-100', 'opacity-100');
        popover.classList.add('scale-95', 'opacity-0');
        setTimeout(() => popover.classList.add('hidden'), 250);
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = popover.classList.contains('hidden');
      toggleMenu(isClosed);
    });

    closeBtn.addEventListener('click', () => toggleMenu(false));

    // Breeze Speed Slider
    petalSpeedInput.addEventListener('input', (e) => {
      config.speedFactor = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent =
        config.speedFactor > 1.8 ? 'Gusting' : config.speedFactor > 0.8 ? 'Brisk' : 'Languid';
    });

    // Blossom Density Slider
    petalDensityInput.addEventListener('input', (e) => {
      config.blossomCount = parseInt(e.target.value, 10);
      document.getElementById('densityVal').textContent = `${config.blossomCount > 60 ? 'Opulent' : config.blossomCount > 30 ? 'Sumptuous' : 'Delicate'} (${config.blossomCount})`;
      syncBlossomCount();
    });

    // Shimmer & Nectar Glow Slider
    sparkleIntensityInput.addEventListener('input', (e) => {
      config.shimmerFactor = parseFloat(e.target.value);
      document.getElementById('shimmerVal').textContent =
        config.shimmerFactor > 1.9 ? 'Radiant Luminescence' : config.shimmerFactor > 0.9 ? 'Opulent' : 'Subtle';
    });

    // Palette Switcher
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => {
          b.classList.remove('active', 'border-fuchsiavibes-400/80', 'bg-burgundy-900/60', 'text-[#ffe6f2]');
          b.classList.add('border-transparent', 'bg-black/30', 'text-neutral-300');
        });
        btn.classList.add('active', 'border-fuchsiavibes-400/80', 'bg-burgundy-900/60', 'text-[#ffe6f2]');
        btn.classList.remove('border-transparent', 'bg-black/30', 'text-neutral-300');

        config.activePalette = btn.getAttribute('data-palette');
        blossoms.forEach(b => b.updateColor());
        shimmers.forEach(s => s.reset());
      });
    });

    // Toggle Vortex / Breeze Force
    toggleSwirlBtn.addEventListener('click', () => {
      config.isVortexActive = !config.isVortexActive;
      toggleSwirlBtn.textContent = config.isVortexActive ? 'Magnetic Vortex' : 'Gentle Drift';
      toggleSwirlBtn.classList.toggle('border-fuchsiavibes-400');
      toggleSwirlBtn.classList.toggle('bg-fuchsiavibes-500/30');
    });

    // Burst Action Button
    scatterBtn.addEventListener('click', () => {
      blossoms.forEach(b => {
        b.vx = (Math.random() - 0.5) * 12;
        b.vy = -3.5 - Math.random() * 7.5;
      });
      addStardust(width / 2, height / 2, 35);
    });

    // Close popover when clicking outside
    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
        toggleMenu(false);
      }
    });

    window.addEventListener('resize', resize);

    window.onload = function() {
      resize();
      render();
    };
  </script>
</body>
</html>
