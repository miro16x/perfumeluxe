    <div class="flex justify-between items-center pb-3 border-b border-blush-200">

  <!-- ================= JAVASCRIPT SIMULATION ================= -->
  <script>
    lucide.createIcons();

    const canvas = document.getElementById('petalCanvas');
    const ctx = canvas.getContext('2d');

    const trailCanvas = document.getElementById('trailCanvas');
    const trailCtx = trailCanvas.getContext('2d');

    const ambientGlow = document.getElementById('ambientGlow');

    let width = 0;
    let height = 0;

    // Simulation Configuration
    const config = {
      petalCount: 45,
      sparkleCount: 60,
      speedFactor: 1.0,
      sparkleFactor: 1.2,
      mouseRepelRadius: 150,
      mouseForceMultiplier: 1.0,
      windX: 0.35,
      windY: 0.45,
      activePalette: 'classic'
    };

    // Color Palettes
    const palettes = {
      classic: [
        { fill: '#f7dcd5', stroke: '#eaafa3', highlight: '#ffffff' },
        { fill: '#fceee9', stroke: '#f5cdc3', highlight: '#ffffff' },
        { fill: '#eed1c7', stroke: '#dda093', highlight: '#fef2ee' },
        { fill: '#faf3e8', stroke: '#e6c888', highlight: '#ffffff' },
        { fill: '#e8a598', stroke: '#cb7b6c', highlight: '#fdede9' }
      ],
      roseGold: [
        { fill: '#fce5db', stroke: '#e4b28d', highlight: '#fff9f5' },
        { fill: '#f3d3b7', stroke: '#dfba73', highlight: '#ffffff' },
        { fill: '#f6cbb7', stroke: '#c5a059', highlight: '#fef5eb' },
        { fill: '#eec29a', stroke: '#b98748', highlight: '#fff' }
      ],
      camellia: [
        { fill: '#ffffff', stroke: '#f3e6e1', highlight: '#ffffff' },
        { fill: '#faf3ef', stroke: '#e9d6d0', highlight: '#ffffff' },
        { fill: '#f4eae5', stroke: '#dfc6be', highlight: '#ffffff' },
        { fill: '#fff9f6', stroke: '#eed0c6', highlight: '#ffffff' }
      ],
      peony: [
        { fill: '#e88f82', stroke: '#c85e50', highlight: '#fbd7d1' },
        { fill: '#db786b', stroke: '#b04a3e', highlight: '#f8cac2' },
        { fill: '#f1aba0', stroke: '#db8275', highlight: '#ffffff' },
        { fill: '#bc5649', stroke: '#903126', highlight: '#f6b8ae' }
      ]
    };

    // Mouse Tracking
    const mouse = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      targetX: window.innerWidth / 2,
      targetY: window.innerHeight / 2,
      isDown: false
    };

    // Petal Class with 3D fluttering & sway
    class Petal {
      constructor(isInitial = false) {
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        this.x = isInitial ? Math.random() * width : Math.random() * width * 1.3 - width * 0.15;
        this.y = isInitial ? Math.random() * height : -60 - Math.random() * 80;

        // Depth scale (0.4 = background soft blur, 1.3 = close)
        this.depth = 0.4 + Math.random() * 0.9;
        this.baseSize = (11 + Math.random() * 18) * this.depth;
        this.size = this.baseSize;

        // Rotation & 3D flutter
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.022;
        this.flip = Math.random() * Math.PI;
        this.flipSpeed = 0.015 + Math.random() * 0.028;

        this.vx = (0.3 + Math.random() * 0.7) * this.depth;
        this.vy = (0.5 + Math.random() * 0.9) * this.depth;

        this.opacity = (0.35 + Math.random() * 0.5) * (this.depth > 1 ? 0.95 : 0.75);
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.02 + Math.random() * 0.02;

        this.updateColor();
      }

      updateColor() {
        const set = palettes[config.activePalette];
        this.color = set[Math.floor(Math.random() * set.length)];
      }

      update() {
        this.swayPhase += this.swaySpeed * config.speedFactor;
        this.angle += this.angularSpeed * config.speedFactor;
        this.flip += this.flipSpeed * config.speedFactor;

        const swayX = Math.sin(this.swayPhase) * (1.3 * this.depth);
        this.x += (this.vx * config.speedFactor + config.windX + swayX);
        this.y += (this.vy * config.speedFactor + config.windY);

        // Interactive Mouse Avoidance / Ripple Push
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.mouseRepelRadius) {
          const force = (1 - dist / config.mouseRepelRadius) * 4.2 * this.depth * config.mouseForceMultiplier;
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * force;
          this.y += Math.sin(angle) * force;
          this.angle += 0.04;
        }

        // Screen wrap
        if (this.y > height + 80 || this.x > width + 120 || this.x < -140) {
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        // 3D vertical scale flip
        const verticalScale = Math.sin(this.flip);
        c.scale(1, Math.abs(verticalScale) < 0.1 ? 0.1 : verticalScale);

        // Organic curved petal geometry
        c.beginPath();
        c.moveTo(0, -this.size * 0.85);
        c.bezierCurveTo(this.size * 0.85, -this.size * 0.75, this.size * 0.95, this.size * 0.5, 0, this.size);
        c.bezierCurveTo(-this.size * 0.95, this.size * 0.5, -this.size * 0.85, -this.size * 0.75, 0, -this.size * 0.85);
        c.closePath();

        // Shading Gradient
        const grad = c.createLinearGradient(-this.size * 0.4, -this.size * 0.5, this.size * 0.4, this.size * 0.8);
        grad.addColorStop(0, this.color.highlight);
        grad.addColorStop(0.4, this.color.fill);
        grad.addColorStop(1, this.color.stroke);

        c.fillStyle = grad;
        c.globalAlpha = this.opacity;
        c.shadowColor = 'rgba(215, 142, 126, 0.25)';
        c.shadowBlur = 6 * this.depth;
        c.fill();

        // Delicate Petal Vein
        c.beginPath();
        c.moveTo(0, -this.size * 0.5);
        c.quadraticCurveTo(this.size * 0.1, 0, 0, this.size * 0.8);
        c.strokeStyle = this.color.stroke;
        c.lineWidth = 0.65;
        c.globalAlpha = this.opacity * 0.45;
        c.stroke();

        c.restore();
      }
    }

    // Effervescent Floating Gold Stardust
    class Sparkle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 0.8 + Math.random() * 2.2;
        this.alpha = 0.25 + Math.random() * 0.75;
        this.pulse = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.03 + Math.random() * 0.05;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = -0.2 - Math.random() * 0.45;
        this.color = Math.random() > 0.4 ? '#dfba73' : '#faecd0';
      }

      update() {
        this.pulse += this.pulseSpeed * config.sparkleFactor;
        this.y += this.vy * config.sparkleFactor;
        this.x += this.vx * config.sparkleFactor;

        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 80) {
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * 1.5;
          this.y += Math.sin(angle) * 1.5;
        }

        if (this.y < -20 || this.x < 0 || this.x > width) {
          this.reset();
          this.y = height + 10;
        }
      }

      draw(c) {
        const currentAlpha = Math.max(0, (Math.sin(this.pulse) * 0.5 + 0.5) * this.alpha);
        c.save();
        c.globalAlpha = currentAlpha;
        c.fillStyle = this.color;
        c.shadowColor = '#c5a059';
        c.shadowBlur = 5;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // Cursor Follower Stardust Sparkle Trail
    const trailPoints = [];
    function addTrailSparkle(x, y, count = 1) {
      for (let i = 0; i < count; i++) {
        if (trailPoints.length > 50) trailPoints.shift();
        trailPoints.push({
          x: x + (Math.random() - 0.5) * 18,
          y: y + (Math.random() - 0.5) * 18,
          radius: 1.2 + Math.random() * 2.5,
          life: 1.0,
          decay: 0.03 + Math.random() * 0.03
        });
      }
    }

    let petals = [];
    let sparkles = [];

    function syncPetalCount() {
      if (petals.length < config.petalCount) {
        while (petals.length < config.petalCount) {
          petals.push(new Petal(false));
        }
      } else if (petals.length > config.petalCount) {
        petals.splice(config.petalCount);
      }
    }

    function resize() {
      width = canvas.width = trailCanvas.width = window.innerWidth;
      height = canvas.height = trailCanvas.height = window.innerHeight;

      petals = Array.from({ length: config.petalCount }, () => new Petal(true));
      sparkles = Array.from({ length: config.sparkleCount }, () => new Sparkle());
    }

    // -------------------------------------------------------------
    // RENDER LOOP
    // -------------------------------------------------------------
    function render() {
      // Smooth mouse easing
      mouse.x += (mouse.targetX - mouse.x) * 0.1;
      mouse.y += (mouse.targetY - mouse.y) * 0.1;

      // Update ambient glow position
      if (ambientGlow) {
        const xPercent = (mouse.x / width) * 100;
        const yPercent = (mouse.y / height) * 100;
        ambientGlow.style.setProperty('--mouse-x', `${xPercent}%`);
        ambientGlow.style.setProperty('--mouse-y', `${yPercent}%`);
      }

      ctx.clearRect(0, 0, width, height);

      // Render Petals
      for (let i = 0; i < petals.length; i++) {
        petals[i].update();
        petals[i].draw(ctx);
      }

      // Render Shimmer Dust
      for (let i = 0; i < sparkles.length; i++) {
        sparkles[i].update();
        sparkles[i].draw(ctx);
      }

      // Render Stardust Trail
      trailCtx.clearRect(0, 0, width, height);
      for (let i = trailPoints.length - 1; i >= 0; i--) {
        const pt = trailPoints[i];
        pt.life -= pt.decay;
        if (pt.life <= 0) {
          trailPoints.splice(i, 1);
          continue;
        }

        trailCtx.save();
        trailCtx.globalAlpha = pt.life * 0.85;
        trailCtx.fillStyle = '#dfba73';
        trailCtx.shadowColor = '#c5a059';
        trailCtx.shadowBlur = 8;
        trailCtx.beginPath();
        trailCtx.arc(pt.x, pt.y, pt.radius * pt.life, 0, Math.PI * 2);
        trailCtx.fill();
        trailCtx.restore();
      }

      requestAnimationFrame(render);
    }

    // -------------------------------------------------------------
    // USER INTERACTIONS
    // -------------------------------------------------------------
    function handlePointerMove(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.targetX = clientX;
      mouse.targetY = clientY;

      addTrailSparkle(clientX, clientY, 1);

      if (mouse.isDown) {
        addTrailSparkle(clientX, clientY, 2);
      }
    }

    window.addEventListener('mousemove', handlePointerMove, { passive: true });
    window.addEventListener('touchmove', handlePointerMove, { passive: true });

    // Click / Drag Burst
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ambientPopover, #toggleControlsBtn')) return;
      mouse.isDown = true;
      burstPetalsAt(e.clientX, e.clientY, 8);
    });

    window.addEventListener('mouseup', () => { mouse.isDown = false; });

    function burstPetalsAt(x, y, amount = 10) {
      addTrailSparkle(x, y, 12);
      for (let i = 0; i < amount; i++) {
        const p = new Petal(false);
        p.x = x + (Math.random() - 0.5) * 40;
        p.y = y + (Math.random() - 0.5) * 40;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        petals.push(p);
      }
      if (petals.length > config.petalCount + 25) {
        petals.splice(0, amount);
      }
    }

    // -------------------------------------------------------------
    // ATMOSPHERE CONTROLS LOGIC
    // -------------------------------------------------------------
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const popover = document.getElementById('ambientPopover');
    const closeBtn = document.getElementById('closeControlsBtn');

    const petalSpeedInput = document.getElementById('petalSpeed');
    const petalDensityInput = document.getElementById('petalDensity');
    const sparkleIntensityInput = document.getElementById('sparkleIntensity');
    const scatterBtn = document.getElementById('scatterPetalsBtn');
    const toggleGravityBtn = document.getElementById('toggleGravityBtn');
    const paletteButtons = document.querySelectorAll('.palette-btn');

    function toggleMenu(show) {
      if (show) {
        popover.classList.remove('hidden');
        requestAnimationFrame(() => {
          popover.classList.remove('scale-95', 'opacity-0');
          popover.classList.add('scale-100', 'opacity-100');
        });
      } else {
        popover.classList.remove('scale-100', 'opacity-100');
        popover.classList.add('scale-95', 'opacity-0');
        setTimeout(() => popover.classList.add('hidden'), 250);
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = popover.classList.contains('hidden');
      toggleMenu(isClosed);
    });

    closeBtn.addEventListener('click', () => toggleMenu(false));

    // Petal Speed
    petalSpeedInput.addEventListener('input', (e) => {
      config.speedFactor = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent =
        config.speedFactor > 1.8 ? 'Brisk' : config.speedFactor > 0.8 ? 'Moderate' : 'Serene';
    });

    // Petal Density
    petalDensityInput.addEventListener('input', (e) => {
      config.petalCount = parseInt(e.target.value, 10);
      document.getElementById('densityVal').textContent = `${config.petalCount > 60 ? 'Dense' : config.petalCount > 30 ? 'Balanced' : 'Subtle'} (${config.petalCount})`;
      syncPetalCount();
    });

    // Shimmer Intensity
    sparkleIntensityInput.addEventListener('input', (e) => {
      config.sparkleFactor = parseFloat(e.target.value);
      document.getElementById('shimmerVal').textContent =
        config.sparkleFactor > 1.8 ? 'Radiant' : config.sparkleFactor > 0.9 ? 'Vibrant' : 'Gentle';
    });

    // Color Harmony Switcher
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => {
          b.classList.remove('active', 'border-champagne-500', 'bg-white/70');
          b.classList.add('border-transparent', 'bg-white/30');
        });
        btn.classList.add('active', 'border-champagne-500', 'bg-white/70');
        btn.classList.remove('border-transparent', 'bg-white/30');

        config.activePalette = btn.getAttribute('data-palette');
        petals.forEach(p => p.updateColor());
      });
    });

    // Scatter Action
    scatterBtn.addEventListener('click', () => {
      petals.forEach(p => {
        p.vx = (Math.random() - 0.5) * 9;
        p.vy = -3 - Math.random() * 6;
      });
      addTrailSparkle(width / 2, height / 2, 25);
    });

    // Toggle Force Mode
    let strongWind = false;
    toggleGravityBtn.addEventListener('click', () => {
      strongWind = !strongWind;
      config.mouseForceMultiplier = strongWind ? 2.5 : 1.0;
      config.mouseRepelRadius = strongWind ? 220 : 150;
      toggleGravityBtn.textContent = strongWind ? 'Strong Gust' : 'Gentle Breeze';
      toggleGravityBtn.classList.toggle('border-champagne-500');
    });

    // Close when clicking outside
    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
        toggleMenu(false);
      }
    });

    window.addEventListener('resize', resize);

    window.onload = function() {
      resize();
      render();
    };
  </script>
</body>
</html>
