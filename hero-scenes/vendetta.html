  <!-- ================= CANVAS ANIMATION & BARE TREE ENGINE ================= -->
  <script>
    lucide.createIcons();

    const treeCanvas = document.getElementById('treeCanvas');
    const treeCtx = treeCanvas.getContext('2d');

    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');

    const sparkCanvas = document.getElementById('sparkCanvas');
    const sparkCtx = sparkCanvas.getContext('2d');

    const ambientGlow = document.getElementById('ambientGlow');

    let width = 0;
    let height = 0;

    const config = {
      leafCount: 75,
      windFactor: 1.0,
      radianceFactor: 1.2,
      treeMistFactor: 0.75,
      isVortexActive: true,
      activePalette: 'tuscanWoods',
      pullRadius: 250
    };

    const palettes = {
      tuscanWoods: {
        glow: 'rgba(200, 106, 40, 0.22)',
        leaves: ['#943d1a', '#c86a28', '#df9b3e', '#7b2e12', '#ad4a22'],
        woods: ['#4a2717', '#381c10', '#60331e', '#2e150a'],
        spices: ['#ffd480', '#ffaa40', '#df9b3e', '#fff1c5'],
        treeFar: 'rgba(20, 10, 6, 0.55)',
        treeNear: 'rgba(10, 5, 3, 0.88)'
      },
      spicedCinnamon: {
        glow: 'rgba(148, 61, 26, 0.25)',
        leaves: ['#781f14', '#943d1a', '#aa381e', '#bf4e2a', '#54150d'],
        woods: ['#3e1810', '#2d100a', '#592316'],
        spices: ['#ff945c', '#ffa978', '#ffd2b8', '#ffeedd'],
        treeFar: 'rgba(28, 9, 6, 0.55)',
        treeNear: 'rgba(14, 4, 3, 0.9)'
      },
      vintageAmber: {
        glow: 'rgba(223, 155, 62, 0.24)',
        leaves: ['#df9b3e', '#c86a28', '#f2ae4b', '#b35d1b', '#d98b2c'],
        woods: ['#522d14', '#41220d', '#6b3c1c'],
        spices: ['#ffe39e', '#ffd670', '#ffffff', '#ffbe42'],
        treeFar: 'rgba(24, 14, 7, 0.55)',
        treeNear: 'rgba(12, 7, 3, 0.88)'
      },
      smokedLeather: {
        glow: 'rgba(90, 55, 33, 0.22)',
        leaves: ['#4d2a19', '#633720', '#7b4427', '#3d2012', '#8c5232'],
        woods: ['#2e180d', '#1f0f07', '#3f2113'],
        spices: ['#f5c292', '#e39d62', '#c27940', '#ffe5cc'],
        treeFar: 'rgba(15, 8, 5, 0.6)',
        treeNear: 'rgba(7, 3, 2, 0.92)'
      }
    };

    const mouse = {
      x: window.innerWidth * 0.5,
      y: window.innerHeight * 0.45,
      targetX: window.innerWidth * 0.5,
      targetY: window.innerHeight * 0.45,
      isDown: false
    };

    // ================= PROCEDURAL LEAFLESS TREES GENERATOR =================
    // Multi-depth bare trees with recursive fractal gnarled branches
    let treeLayers = [];

    class LeaflessTree {
      constructor(x, y, height, maxDepth, branchSpread, layerIndex) {
        this.baseX = x;
        this.baseY = y;
        this.height = height;
        this.maxDepth = maxDepth;
        this.branchSpread = branchSpread;
        this.layerIndex = layerIndex; // 0 = far, 1 = mid, 2 = near
        this.branches = [];
        this.generateBranches(0, 0, -Math.PI / 2, this.height, 0, this.height * 0.08);
      }

      generateBranches(x, y, angle, length, depth, thickness) {
        if (depth > this.maxDepth || length < 4) return;

        // Trunk and branch natural curved distortion
        const curl = (Math.random() - 0.5) * 0.18;
        const targetAngle = angle + curl;
        const endX = x + Math.cos(targetAngle) * length;
        const endY = y + Math.sin(targetAngle) * length;

        this.branches.push({
          startX: x,
          startY: y,
          endX: endX,
          endY: endY,
          depth: depth,
          thickness: thickness
        });

        // Fork count: trunks fork into 2-3 branches
        const forks = depth === 0 ? 3 : (Math.random() > 0.4 ? 2 : 3);
        for (let i = 0; i < forks; i++) {
          const spread = (Math.random() - 0.5) * this.branchSpread * (1.1 - depth * 0.15);
          const nextAngle = targetAngle + spread;
          const nextLen = length * (0.68 + Math.random() * 0.22);
          const nextThick = thickness * (0.62 + Math.random() * 0.12);
          this.generateBranches(endX, endY, nextAngle, nextLen, depth + 1, nextThick);
        }
      }

      draw(ctx, parallaxX, parallaxY, pal) {
        ctx.save();
        // Layer parallax depth
        const depthFactor = this.layerIndex === 0 ? 0.015 : (this.layerIndex === 1 ? 0.03 : 0.05);
        const shiftX = (parallaxX - width / 2) * depthFactor;
        const shiftY = (parallaxY - height / 2) * depthFactor * 0.5;

        ctx.translate(this.baseX + shiftX, this.baseY + shiftY);

        const mistOpacity = config.treeMistFactor;
        let baseColor;
        if (this.layerIndex === 0) {
          ctx.globalAlpha = 0.4 * mistOpacity;
          baseColor = pal.treeFar;
        } else if (this.layerIndex === 1) {
          ctx.globalAlpha = 0.65 * mistOpacity;
          baseColor = pal.treeNear;
        } else {
          ctx.globalAlpha = 0.88 * mistOpacity;
          baseColor = '#060302';
        }

        ctx.strokeStyle = baseColor;
        ctx.lineCap = 'round';

        // Draw each branch segment
        for (let b of this.branches) {
          ctx.lineWidth = Math.max(0.6, b.thickness);
          ctx.beginPath();
          ctx.moveTo(b.startX, b.startY);
          ctx.lineTo(b.endX, b.endY);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    function createForest() {
      treeLayers = [];
      const horizonY = height * 0.98;

      // Layer 0: Distant faint misty leafless horizon forest
      const farCount = Math.max(5, Math.floor(width / 220));
      for (let i = 0; i < farCount; i++) {
        const x = (width / farCount) * i + (Math.random() - 0.5) * 80;
        const treeH = height * (0.28 + Math.random() * 0.15);
        treeLayers.push(new LeaflessTree(x, horizonY - 15, treeH, 5, 0.75, 0));
      }

      // Layer 1: Midground rugged gnarled Tuscan oaks
      const midCount = Math.max(3, Math.floor(width / 340));
      for (let i = 0; i < midCount; i++) {
        const x = (width / midCount) * i + (Math.random() - 0.5) * 110 + 60;
        const treeH = height * (0.42 + Math.random() * 0.18);
        treeLayers.push(new LeaflessTree(x, horizonY - 5, treeH, 6, 0.82, 1));
      }

      // Layer 2: Near edge bare silhouette framing branches (left & right sides)
      const nearLeft = new LeaflessTree(width * 0.04, horizonY + 20, height * 0.62, 6, 0.7, 2);
      const nearRight = new LeaflessTree(width * 0.96, horizonY + 20, height * 0.65, 6, 0.7, 2);
      treeLayers.push(nearLeft, nearRight);
    }

    // ================= MAIN CANVAS: FALL FOLIAGE & SPICED WOOD PHYSICS =================
    class FallElement {
      constructor(isInitial = false) {
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        // Types:
        // 0 = Tuscan Lobed Oak Leaf
        // 1 = Serrated Autumn Maple Leaf
        // 2 = Cedarwood Splinter / Cinnamon Bark Chip
        // 3 = Glowing Spiced Amber Dust
        const r = Math.random();
        if (r > 0.6) this.type = 0;
        else if (r > 0.35) this.type = 1;
        else if (r > 0.15) this.type = 2;
        else this.type = 3;

        this.x = isInitial ? Math.random() * width : Math.random() * width * 1.3 - width * 0.15;
        this.y = isInitial ? Math.random() * height : -40 - Math.random() * 60;

        this.depth = 0.5 + Math.random() * 0.85;
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.04;

        if (this.type === 0 || this.type === 1) {
          // Foliage
          this.size = (12 + Math.random() * 16) * this.depth;
          this.vx = 0.4 + Math.random() * 1.2;
          this.vy = (0.9 + Math.random() * 1.6) * this.depth;
          this.flip = Math.random() * Math.PI;
          this.flipSpeed = 0.015 + Math.random() * 0.035;
          this.sway = Math.random() * Math.PI * 2;
          this.swaySpeed = 0.02 + Math.random() * 0.03;
          this.life = 1.0;
          this.decay = 0.0008 + Math.random() * 0.0016;
        } else if (this.type === 2) {
          // Cedar Splinter / Cinnamon Bark
          this.size = (8 + Math.random() * 14) * this.depth;
          this.aspect = 0.2 + Math.random() * 0.2;
          this.vx = 0.3 + Math.random() * 0.9;
          this.vy = (1.1 + Math.random() * 2.0) * this.depth;
          this.flip = Math.random() * Math.PI;
          this.flipSpeed = 0.025 + Math.random() * 0.045;
          this.life = 1.0;
          this.decay = 0.001 + Math.random() * 0.002;
        } else {
          // Glowing Spiced Amber Particle
          this.size = (1.5 + Math.random() * 3.0) * this.depth;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = -(0.5 + Math.random() * 1.5) * this.depth; // Upward buoyant thermal draft
          this.pulse = Math.random() * Math.PI * 2;
          this.life = 1.0;
          this.decay = 0.002 + Math.random() * 0.004;
        }

        this.updateColor();
      }

      updateColor() {
        const pal = palettes[config.activePalette];
        if (this.type === 0 || this.type === 1) {
          this.color = pal.leaves[Math.floor(Math.random() * pal.leaves.length)];
          this.spineColor = '#ffd699';
        } else if (this.type === 2) {
          this.color = pal.woods[Math.floor(Math.random() * pal.woods.length)];
          this.edgeColor = '#df9b3e';
        } else {
          this.color = pal.spices[Math.floor(Math.random() * pal.spices.length)];
        }
      }

      update() {
        this.life -= this.decay;
        this.angle += this.angularSpeed * config.windFactor;

        if (this.type === 0 || this.type === 1) {
          this.sway += this.swaySpeed * config.windFactor;
          this.flip += this.flipSpeed * config.windFactor;
          this.x += (this.vx + Math.sin(this.sway) * 1.4) * config.windFactor;
          this.y += this.vy * config.windFactor;
        } else if (this.type === 2) {
          this.flip += this.flipSpeed * config.windFactor;
          this.x += this.vx * config.windFactor;
          this.y += this.vy * config.windFactor;
        } else {
          this.pulse += 0.06;
          this.x += (this.vx + Math.sin(this.pulse) * 0.5) * config.windFactor;
          this.y += this.vy * config.windFactor;
        }

        // Magnetic Wind Eddy / Repulsion
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.pullRadius) {
          const norm = 1 - dist / config.pullRadius;
          const angle = Math.atan2(dy, dx);

          if (config.isVortexActive) {
            const tangent = angle + Math.PI / 2;
            const swirl = norm * 4.4 * this.depth;
            const pull = norm * 1.8 * this.depth;
            this.x += Math.cos(tangent) * swirl - Math.cos(angle) * pull;
            this.y += Math.sin(tangent) * swirl - Math.sin(angle) * pull;
          } else {
            const push = norm * 5.5 * this.depth;
            this.x += Math.cos(angle) * push;
            this.y += Math.sin(angle) * push;
          }
        }

        // Reset offscreen
        if (this.life <= 0 || this.y > height + 60 || this.x > width + 80 || this.x < -80 || (this.type === 3 && this.y < -40)) {
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        if (this.type === 0) {
          // Tuscan Lobed Oak Leaf
          const flipScale = Math.sin(this.flip);
          c.scale(1, Math.abs(flipScale) < 0.15 ? 0.15 : flipScale);
          c.globalAlpha = Math.max(0.1, this.life * 0.92);

          const s = this.size;
          c.shadowColor = this.color;
          c.shadowBlur = 8 * config.radianceFactor;

          c.fillStyle = this.color;
          c.beginPath();
          c.moveTo(0, -s * 0.8);
          c.bezierCurveTo(s * 0.45, -s * 0.6, s * 0.55, -s * 0.2, s * 0.45, 0);
          c.bezierCurveTo(s * 0.6, s * 0.25, s * 0.5, s * 0.6, 0, s * 0.85);
          c.bezierCurveTo(-s * 0.5, s * 0.6, -s * 0.6, s * 0.25, -s * 0.45, 0);
          c.bezierCurveTo(-s * 0.55, -s * 0.2, -s * 0.45, -s * 0.6, 0, -s * 0.8);
          c.fill();

          // Leaf Central Spine
          c.strokeStyle = this.spineColor;
          c.globalAlpha = 0.35;
          c.lineWidth = 0.8;
          c.beginPath();
          c.moveTo(0, -s * 0.7);
          c.lineTo(0, s * 0.75);
          c.stroke();

        } else if (this.type === 1) {
          // Serrated Autumn Maple Leaf
          const flipScale = Math.cos(this.flip);
          c.scale(Math.abs(flipScale) < 0.15 ? 0.15 : flipScale, 1);
          c.globalAlpha = Math.max(0.1, this.life * 0.88);

          const s = this.size * 0.9;
          c.shadowColor = this.color;
          c.shadowBlur = 8 * config.radianceFactor;

          c.fillStyle = this.color;
          c.beginPath();
          c.moveTo(0, -s * 0.85);
          c.lineTo(s * 0.3, -s * 0.4);
          c.lineTo(s * 0.8, -s * 0.3);
          c.lineTo(s * 0.4, 0.1);
          c.lineTo(s * 0.6, s * 0.65);
          c.lineTo(0, s * 0.35);
          c.lineTo(-s * 0.6, s * 0.65);
          c.lineTo(-s * 0.4, 0.1);
          c.lineTo(-s * 0.8, -s * 0.3);
          c.lineTo(-s * 0.3, -s * 0.4);
          c.closePath();
          c.fill();

        } else if (this.type === 2) {
          // Cedar Splinter / Cinnamon Bark Chip
          const flipScale = Math.sin(this.flip);
          c.scale(1, Math.abs(flipScale) < 0.15 ? 0.15 : flipScale);
          c.globalAlpha = Math.max(0.1, this.life * 0.9);

          const w = this.size;
          const h = this.size * this.aspect;

          c.shadowColor = this.color;
          c.shadowBlur = 6;

          c.fillStyle = this.color;
          c.beginPath();
          c.moveTo(-w / 2, -h / 2);
          c.lineTo(w / 2, -h / 3);
          c.lineTo(w / 2 * 0.9, h / 2);
          c.lineTo(-w / 2 * 0.8, h / 2 * 0.7);
          c.closePath();
          c.fill();

          // Bark Grain Vein
          c.strokeStyle = this.edgeColor;
          c.lineWidth = 0.7;
          c.globalAlpha = 0.45;
          c.stroke();

        } else {
          // Glowing Spiced Amber Dust / Clove Spark
          const emberAlpha = Math.max(0, this.life * (Math.sin(this.pulse) * 0.35 + 0.65));
          c.globalAlpha = emberAlpha;
          c.shadowColor = this.color;
          c.shadowBlur = 12 * config.radianceFactor;

          c.fillStyle = this.color;
          c.beginPath();
          c.arc(0, 0, this.size, 0, Math.PI * 2);
          c.fill();

          // Warm core
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
          c.fill();
        }

        c.restore();
      }
    }

    // ================= SPICE SPARK TRAIL =================
    const sparks = [];
    function addSparks(x, y, count = 1) {
      const pal = palettes[config.activePalette];
      for (let i = 0; i < count; i++) {
        if (sparks.length > 70) sparks.shift();
        sparks.push({
          x: x + (Math.random() - 0.5) * 16,
          y: y + (Math.random() - 0.5) * 16,
          vx: (Math.random() - 0.5) * 2.0,
          vy: (Math.random() - 0.5) * 2.0 - 0.8,
          radius: 1.2 + Math.random() * 2.4,
          color: pal.spices[Math.floor(Math.random() * pal.spices.length)],
          life: 1.0,
          decay: 0.024 + Math.random() * 0.03
        });
      }
    }

    let elements = [];

    function syncLeafCount() {
      if (elements.length < config.leafCount) {
        while (elements.length < config.leafCount) {
          elements.push(new FallElement(false));
        }
      } else if (elements.length > config.leafCount) {
        elements.splice(config.leafCount);
      }
    }

    function resize() {
      width = treeCanvas.width = mainCanvas.width = sparkCanvas.width = window.innerWidth;
      height = treeCanvas.height = mainCanvas.height = sparkCanvas.height = window.innerHeight;

      createForest();
      elements = Array.from({ length: config.leafCount }, () => new FallElement(true));
    }

    // ================= MAIN ANIMATION LOOP =================
    function render() {
      mouse.x += (mouse.targetX - mouse.x) * 0.07;
      mouse.y += (mouse.targetY - mouse.y) * 0.07;

      // Update Cursor Amber Glow Bloom
      if (ambientGlow) {
        const xPercent = (mouse.x / width) * 100;
        const yPercent = (mouse.y / height) * 100;
        ambientGlow.style.setProperty('--mouse-x', `${xPercent}%`);
        ambientGlow.style.setProperty('--mouse-y', `${yPercent}%`);
      }

      // 1. Draw Leafless Trees with Mouse Parallax
      treeCtx.clearRect(0, 0, width, height);
      const activePal = palettes[config.activePalette];
      for (let tree of treeLayers) {
        tree.draw(treeCtx, mouse.x, mouse.y, activePal);
      }

      // 2. Draw Falling Autumn Leaves & Spiced Wood
      mainCtx.clearRect(0, 0, width, height);
      for (let i = 0; i < elements.length; i++) {
        elements[i].update();
        elements[i].draw(mainCtx);
      }

      // 3. Draw Spice Trail Sparks
      sparkCtx.clearRect(0, 0, width, height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.life -= sp.decay;

        if (sp.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        sparkCtx.save();
        sparkCtx.globalAlpha = sp.life * 0.9;
        sparkCtx.fillStyle = sp.color;
        sparkCtx.shadowColor = sp.color;
        sparkCtx.shadowBlur = 10;
        sparkCtx.beginPath();
        sparkCtx.arc(sp.x, sp.y, sp.radius * sp.life, 0, Math.PI * 2);
        sparkCtx.fill();
        sparkCtx.restore();
      }

      requestAnimationFrame(render);
    }

    // ================= POINTER & BURST LOGIC =================
    function handlePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.targetX = clientX;
      mouse.targetY = clientY;

      addSparks(clientX, clientY, 1);
      if (mouse.isDown) addSparks(clientX, clientY, 2);
    }

    window.addEventListener('mousemove', handlePointer, { passive: true });
    window.addEventListener('touchmove', handlePointer, { passive: true });

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ambientPopover, #toggleControlsBtn')) return;
      mouse.isDown = true;
      triggerBurst(e.clientX, e.clientY, 16);
    });

    window.addEventListener('mouseup', () => { mouse.isDown = false; });

    // Autumn Foliage Burst
    function triggerBurst(x, y, count = 20) {
      addSparks(x, y, 25);
      for (let i = 0; i < count; i++) {
        const el = new FallElement(false);
        el.x = x + (Math.random() - 0.5) * 30;
        el.y = y + (Math.random() - 0.5) * 30;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.8 + Math.random() * 6.5;
        el.vx = Math.cos(angle) * speed;
        el.vy = Math.sin(angle) * speed;
        el.life = 1.0;
        el.updateColor();
        elements.push(el);
      }

      if (elements.length > config.leafCount + 35) {
        elements.splice(0, count);
      }
    }

    // ================= UI CONSOLE LOGIC =================
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const popover = document.getElementById('ambientPopover');
    const closeBtn = document.getElementById('closeControlsBtn');

    const windSpeedInput = document.getElementById('windSpeed');
    const leafDensityInput = document.getElementById('leafDensity');
    const amberRadianceInput = document.getElementById('amberRadiance');
    const treeMistInput = document.getElementById('treeMist');
    const toggleVortexBtn = document.getElementById('toggleVortexBtn');
    const triggerBurstBtn = document.getElementById('triggerBurstBtn');
    const paletteButtons = document.querySelectorAll('.palette-btn');

    function toggleMenu(show) {
      if (show) {
        popover.classList.remove('hidden');
        requestAnimationFrame(() => {
          popover.classList.remove('scale-95', 'opacity-0');
          popover.classList.add('scale-100', 'opacity-100');
        });
      } else {
        popover.classList.remove('scale-100', 'opacity-100');
        popover.classList.add('scale-95', 'opacity-0');
        setTimeout(() => popover.classList.add('hidden'), 250);
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = popover.classList.contains('hidden');
      toggleMenu(isClosed);
    });

    closeBtn.addEventListener('click', () => toggleMenu(false));

    // Sliders
    windSpeedInput.addEventListener('input', (e) => {
      config.windFactor = parseFloat(e.target.value);
      document.getElementById('windVal').textContent = `${config.windFactor.toFixed(1)}x Gust`;
    });

    leafDensityInput.addEventListener('input', (e) => {
      config.leafCount = parseInt(e.target.value, 10);
      document.getElementById('densityVal').textContent = `${config.leafCount > 100 ? 'Dense Woods' : config.leafCount > 60 ? 'Plentiful' : 'Subtle'} (${config.leafCount})`;
      syncLeafCount();
    });

    amberRadianceInput.addEventListener('input', (e) => {
      config.radianceFactor = parseFloat(e.target.value);
      document.getElementById('radianceVal').textContent =
        config.radianceFactor > 1.8 ? 'Golden Fire' : config.radianceFactor > 1.0 ? 'Luminous' : 'Smoky Autumn';
    });

    treeMistInput.addEventListener('input', (e) => {
      config.treeMistFactor = parseFloat(e.target.value);
      document.getElementById('treeMistVal').textContent =
        config.treeMistFactor > 0.8 ? 'Crisp Silhouette' : config.treeMistFactor > 0.45 ? 'Nocturnal Mist' : 'Faint Shadow';
    });

    // Palette Switcher
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => {
          b.classList.remove('active', 'border-amber-500/80', 'bg-amber-950/40', 'text-amber-200', 'shadow-[0_0_12px_rgba(200,106,40,0.2)]');
          b.classList.add('border-chestnut/70', 'bg-walnut/70', 'text-slate-400');
        });
        btn.classList.add('active', 'border-amber-500/80', 'bg-amber-950/40', 'text-amber-200', 'shadow-[0_0_12px_rgba(200,106,40,0.2)]');
        btn.classList.remove('border-chestnut/70', 'bg-walnut/70', 'text-slate-400');

        config.activePalette = btn.getAttribute('data-palette');
        elements.forEach(el => el.updateColor());
      });
    });

    // Wind Dynamics Toggle
    toggleVortexBtn.addEventListener('click', () => {
      config.isVortexActive = !config.isVortexActive;
      toggleVortexBtn.textContent = config.isVortexActive ? 'Autumn Eddy' : 'Free Gust';
      toggleVortexBtn.classList.toggle('border-amber-500/40');
      toggleVortexBtn.classList.toggle('border-cidergold/40');
    });

    // Scatter Foliage Burst
    triggerBurstBtn.addEventListener('click', () => {
      triggerBurst(width * 0.5, height * 0.45, 30);
      elements.forEach(el => {
        el.vx = (Math.random() - 0.5) * 6.5;
        el.vy = (Math.random() - 0.5) * 5.0 + 2.0;
      });
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
        toggleMenu(false);
      }
    });

    window.addEventListener('resize', resize);

    window.onload = function() {
      resize();
      render();
    };
  </script>
</body>
</html>
