  <!-- ================= ATMOSPHERE BRUSHED OBSIDIAN DRAWER ================= -->

  <!-- ================= CANVAS ANIMATION & PARTICLE PHYSICS ================= -->
  <script>
    lucide.createIcons();

    // Canvas references
    const duneCanvas = document.getElementById('duneCanvas');
    const duneCtx = duneCanvas.getContext('2d');

    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');

    const sparkCanvas = document.getElementById('sparkCanvas');
    const sparkCtx = sparkCanvas.getContext('2d');

    const ambientGlow = document.getElementById('ambientGlow');

    let width = 0;
    let height = 0;

    // Simulation Settings
    const config = {
      emberCount: 90,
      starCount: 160,
      windFactor: 1.0,
      radianceFactor: 1.2,
      isVortexActive: true,
      activePalette: 'midnightSauvage',
      repelRadius: 220
    };

    // Palettes matching Sauvage Extrait aesthetics
    const palettes = {
      midnightSauvage: {
        glow: 'rgba(56, 126, 219, 0.28)',
        horizonHaze: 'rgba(217, 119, 6, 0.16)',
        embers: ['#ff8a3d', '#ffab40', '#38bdf8', '#60a5fa', '#ffa726'],
        foliage: ['#334155', '#475569', '#1e293b'],
        stars: ['#93c5fd', '#ffffff', '#cbd5e1', '#fde047'],
        sparks: ['#60a5fa', '#ff9800', '#93c5fd', '#ffcc80']
      },
      campfireAmber: {
        glow: 'rgba(249, 115, 22, 0.3)',
        horizonHaze: 'rgba(234, 88, 12, 0.22)',
        embers: ['#ff5722', '#ff9800', '#ffb74d', '#ff7043', '#ffeb3b'],
        foliage: ['#422006', '#291403', '#78350f'],
        stars: ['#fed7aa', '#ffffff', '#ffedd5', '#f59e0b'],
        sparks: ['#ff5722', '#ff9800', '#ffd54f']
      },
      desertMineral: {
        glow: 'rgba(56, 189, 248, 0.25)',
        horizonHaze: 'rgba(14, 165, 233, 0.14)',
        embers: ['#38bdf8', '#7dd3fc', '#cbd5e1', '#e2e8f0', '#0284c7'],
        foliage: ['#1e293b', '#334155', '#0f172a'],
        stars: ['#e0f2fe', '#ffffff', '#94a3b8'],
        sparks: ['#38bdf8', '#bae6fd', '#ffffff']
      },
      rawCedar: {
        glow: 'rgba(16, 185, 129, 0.22)',
        horizonHaze: 'rgba(180, 83, 9, 0.18)',
        embers: ['#34d399', '#f59e0b', '#fbbf24', '#059669', '#d97706'],
        foliage: ['#064e3b', '#022c22', '#14532d'],
        stars: ['#d1fae5', '#ffffff', '#fef3c7'],
        sparks: ['#34d399', '#f59e0b', '#a7f3d0']
      }
    };

    // Cursor coordinates
    const mouse = {
      x: window.innerWidth * 0.5,
      y: window.innerHeight * 0.45,
      targetX: window.innerWidth * 0.5,
      targetY: window.innerHeight * 0.45,
      vx: 0,
      vy: 0,
      isDown: false
    };

    // ================= STATIC BACKGROUND STARS & DUNES =================
    let stars = [];
    class Star {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * (height * 0.72);
        this.size = 0.6 + Math.random() * 1.6;
        this.twinkleSpeed = 0.015 + Math.random() * 0.035;
        this.phase = Math.random() * Math.PI * 2;
        this.baseAlpha = 0.2 + Math.random() * 0.7;
      }
      update() {
        this.phase += this.twinkleSpeed;
      }
      draw(c) {
        const pal = palettes[config.activePalette];
        const alpha = Math.max(0.1, (Math.sin(this.phase) * 0.4 + 0.6) * this.baseAlpha);
        c.save();
        c.globalAlpha = alpha;
        c.fillStyle = pal.stars[Math.floor(this.phase) % pal.stars.length];
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // Procedural Layered Desert Dunes & Ridge
    function drawDesertDunes() {
      duneCtx.clearRect(0, 0, width, height);

      // Render celestial stars
      for (let s of stars) {
        s.update();
        s.draw(duneCtx);
      }

      // Parallax mouse offsets
      const offsetX = (mouse.x - width / 2) * 0.03;
      const offsetY = (mouse.y - height / 2) * 0.02;

      // Layer 1: Distant Jagged Ridge (Low Poly / Rocky)
      duneCtx.save();
      duneCtx.beginPath();
      duneCtx.moveTo(0, height);
      duneCtx.lineTo(0, height * 0.68 + offsetY * 0.3);

      const ridgePoints = 12;
      for (let i = 0; i <= ridgePoints; i++) {
        const x = (width / ridgePoints) * i + offsetX * 0.2;
        const baseline = height * 0.68;
        const variance = Math.sin(i * 1.1) * 35 + Math.cos(i * 2.3) * 22;
        duneCtx.lineTo(x, baseline + variance + offsetY * 0.3);
      }
      duneCtx.lineTo(width, height);
      duneCtx.closePath();
      duneCtx.fillStyle = '#0a101d';
      duneCtx.fill();
      duneCtx.restore();

      // Layer 2: Mid-ground Sand Dune Silhouette
      duneCtx.save();
      duneCtx.beginPath();
      duneCtx.moveTo(0, height);
      duneCtx.lineTo(0, height * 0.78 + offsetY * 0.6);
      duneCtx.bezierCurveTo(
        width * 0.28 + offsetX * 0.5, height * 0.73 + offsetY * 0.6,
        width * 0.6 + offsetX * 0.5, height * 0.86 + offsetY * 0.6,
        width, height * 0.79 + offsetY * 0.6
      );
      duneCtx.lineTo(width, height);
      duneCtx.closePath();

      const duneGrad1 = duneCtx.createLinearGradient(0, height * 0.72, 0, height);
      duneGrad1.addColorStop(0, '#090e18');
      duneGrad1.addColorStop(1, '#05070c');
      duneCtx.fillStyle = duneGrad1;
      duneCtx.fill();
      duneCtx.restore();

      // Layer 3: Foreground sweeping midnight dune
      duneCtx.save();
      duneCtx.beginPath();
      duneCtx.moveTo(0, height);
      duneCtx.lineTo(0, height * 0.89 + offsetY);
      duneCtx.bezierCurveTo(
        width * 0.45 + offsetX, height * 0.82 + offsetY,
        width * 0.75 + offsetX, height * 0.94 + offsetY,
        width, height * 0.88 + offsetY
      );
      duneCtx.lineTo(width, height);
      duneCtx.closePath();

      const duneGrad2 = duneCtx.createLinearGradient(0, height * 0.82, 0, height);
      duneGrad2.addColorStop(0, '#07090f');
      duneGrad2.addColorStop(1, '#020306');
      duneCtx.fillStyle = duneGrad2;
      duneCtx.fill();
      duneCtx.restore();
    }

    // ================= PARTICLES: EMBERS, SAND DUST & SAGE LEAVES =================
    class DesertElement {
      constructor(isInitial = false) {
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        // Types: 0 = glowing campfire ember, 1 = fine mineral sand dust, 2 = desert sage / cedar needle
        const rand = Math.random();
        this.type = rand > 0.45 ? 0 : (rand > 0.18 ? 1 : 2);

        this.x = isInitial ? Math.random() * width : Math.random() * width * 1.2 - width * 0.1;
        // Campfire embers drift upwards from bottom/dunes; foliage & dust sweep across
        this.y = isInitial ? Math.random() * height : height + 20 + Math.random() * 50;

        this.depth = 0.5 + Math.random() * 0.9;
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.05;

        if (this.type === 0) {
          // Glowing Ember
          this.size = (1.5 + Math.random() * 2.8) * this.depth;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = -(1.2 + Math.random() * 2.2) * this.depth; // Upward buoyant rise
          this.life = 1.0;
          this.decay = 0.003 + Math.random() * 0.007;
          this.pulse = Math.random() * Math.PI * 2;
        } else if (this.type === 1) {
          // Fine Sand / Mica dust
          this.size = (0.7 + Math.random() * 1.5) * this.depth;
          this.vx = (0.8 + Math.random() * 1.6) * this.depth;
          this.vy = -(0.2 + Math.random() * 0.8) * this.depth;
          this.life = 0.8;
          this.decay = 0.002 + Math.random() * 0.004;
          this.pulse = 0;
        } else {
          // Desert Sage Needle / Cedar Fragment
          this.size = (8 + Math.random() * 10) * this.depth;
          this.vx = (0.7 + Math.random() * 1.4) * this.depth;
          this.vy = -(0.4 + Math.random() * 0.9) * this.depth;
          this.flip = Math.random() * Math.PI;
          this.flipSpeed = 0.02 + Math.random() * 0.04;
          this.life = 1.0;
          this.decay = 0.0015 + Math.random() * 0.003;
        }

        this.updateColor();
      }

      updateColor() {
        const pal = palettes[config.activePalette];
        if (this.type === 0) {
          this.color = pal.embers[Math.floor(Math.random() * pal.embers.length)];
        } else if (this.type === 1) {
          this.color = pal.sparks[Math.floor(Math.random() * pal.sparks.length)];
        } else {
          this.color = pal.foliage[Math.floor(Math.random() * pal.foliage.length)];
        }
      }

      update() {
        this.life -= this.decay;
        this.angle += this.angularSpeed * config.windFactor;

        // Apply wind velocity
        this.x += (this.vx * config.windFactor + 0.4 * config.windFactor);
        this.y += (this.vy * config.windFactor);

        if (this.type === 0) {
          // Ember jitter & sway
          this.pulse += 0.08;
          this.x += Math.sin(this.pulse) * 0.65;
        } else if (this.type === 2) {
          this.flip += this.flipSpeed * config.windFactor;
        }

        // Interactive cursor wind vortex
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.repelRadius) {
          const normDist = 1 - dist / config.repelRadius;
          const angle = Math.atan2(dy, dx);

          if (config.isVortexActive) {
            // Desert whirlwind swirling around cursor
            const tangentAngle = angle + Math.PI / 2;
            const swirlStrength = normDist * 4.5 * this.depth;
            const outwardPush = normDist * 2.8 * this.depth;

            this.x += Math.cos(tangentAngle) * swirlStrength + Math.cos(angle) * outwardPush;
            this.y += Math.sin(tangentAngle) * swirlStrength + Math.sin(angle) * outwardPush;
          } else {
            // Direct desert blast displacement
            const push = normDist * 6.5 * this.depth;
            this.x += Math.cos(angle) * push;
            this.y += Math.sin(angle) * push;
          }
        }

        // Reset if offscreen or expired
        if (this.life <= 0 || this.y < -30 || this.x > width + 60 || this.x < -60) {
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        if (this.type === 0) {
          // Luminous Ember with intense glowing core
          const emberAlpha = Math.max(0, this.life * (Math.sin(this.pulse) * 0.25 + 0.75));
          c.globalAlpha = emberAlpha;
          c.shadowColor = this.color;
          c.shadowBlur = 12 * config.radianceFactor;

          c.fillStyle = this.color;
          c.beginPath();
          c.arc(0, 0, this.size, 0, Math.PI * 2);
          c.fill();

          // White-hot center
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
          c.fill();

        } else if (this.type === 1) {
          // Mineral Sand particle
          c.globalAlpha = this.life * 0.6;
          c.fillStyle = this.color;
          c.beginPath();
          c.arc(0, 0, this.size, 0, Math.PI * 2);
          c.fill();

        } else {
          // Dried Desert Sage needle / Cedar splinter
          const flipScale = Math.sin(this.flip);
          c.scale(1, Math.abs(flipScale) < 0.15 ? 0.15 : flipScale);
          c.globalAlpha = this.life * 0.75;

          c.beginPath();
          c.moveTo(-this.size * 0.5, 0);
          c.quadraticCurveTo(0, -1.8, this.size * 0.5, 0);
          c.quadraticCurveTo(0, 1.8, -this.size * 0.5, 0);
          c.closePath();

          c.fillStyle = this.color;
          c.fill();

          // Subtle pine needle spine
          c.beginPath();
          c.moveTo(-this.size * 0.45, 0);
          c.lineTo(this.size * 0.45, 0);
          c.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          c.lineWidth = 0.5;
          c.stroke();
        }

        c.restore();
      }
    }

    // Cursor Fast Spark Trail
    const sparks = [];
    function addSparks(x, y, count = 1) {
      const pal = palettes[config.activePalette];
      for (let i = 0; i < count; i++) {
        if (sparks.length > 70) sparks.shift();
        sparks.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 2.2,
          vy: (Math.random() - 0.5) * 2.2 - 1.2,
          radius: 1.2 + Math.random() * 2.4,
          color: pal.sparks[Math.floor(Math.random() * pal.sparks.length)],
          life: 1.0,
          decay: 0.025 + Math.random() * 0.03
        });
      }
    }

    let elements = [];

    function syncElementCount() {
      if (elements.length < config.emberCount) {
        while (elements.length < config.emberCount) {
          elements.push(new DesertElement(false));
        }
      } else if (elements.length > config.emberCount) {
        elements.splice(config.emberCount);
      }
    }

    function resize() {
      width = duneCanvas.width = mainCanvas.width = sparkCanvas.width = window.innerWidth;
      height = duneCanvas.height = mainCanvas.height = sparkCanvas.height = window.innerHeight;

      stars = Array.from({ length: config.starCount }, () => new Star());
      elements = Array.from({ length: config.emberCount }, () => new DesertElement(true));

      drawDesertDunes();
    }

    // ================= MAIN ANIMATION LOOP =================
    function render() {
      mouse.vx = mouse.targetX - mouse.x;
      mouse.vy = mouse.targetY - mouse.y;
      mouse.x += mouse.vx * 0.08;
      mouse.y += mouse.vy * 0.08;

      // Update Moonlight Corona Position
      if (ambientGlow) {
        const xPercent = (mouse.x / width) * 100;
        const yPercent = (mouse.y / height) * 100;
        ambientGlow.style.setProperty('--mouse-x', `${xPercent}%`);
        ambientGlow.style.setProperty('--mouse-y', `${yPercent}%`);
      }

      // Redraw background dunes with parallax
      drawDesertDunes();

      mainCtx.clearRect(0, 0, width, height);

      // Render embers, sage needles & sand particles
      for (let i = 0; i < elements.length; i++) {
        elements[i].update();
        elements[i].draw(mainCtx);
      }

      // Render interactive cursor stardust trail
      sparkCtx.clearRect(0, 0, width, height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.life -= sp.decay;

        if (sp.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        sparkCtx.save();
        sparkCtx.globalAlpha = sp.life * 0.95;
        sparkCtx.fillStyle = sp.color;
        sparkCtx.shadowColor = sp.color;
        sparkCtx.shadowBlur = 10;
        sparkCtx.beginPath();
        sparkCtx.arc(sp.x, sp.y, sp.radius * sp.life, 0, Math.PI * 2);
        sparkCtx.fill();
        sparkCtx.restore();
      }

      requestAnimationFrame(render);
    }

    // ================= POINTER & CLICK INTERACTIONS =================
    function handlePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.targetX = clientX;
      mouse.targetY = clientY;

      addSparks(clientX, clientY, 1);
      if (mouse.isDown) addSparks(clientX, clientY, 2);
    }

    window.addEventListener('mousemove', handlePointer, { passive: true });
    window.addEventListener('touchmove', handlePointer, { passive: true });

    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ambientPopover, #toggleControlsBtn')) return;
      mouse.isDown = true;
      triggerEmberBurst(e.clientX, e.clientY, 16);
    });

    window.addEventListener('mouseup', () => { mouse.isDown = false; });

    // Ember Storm / Burst effect
    function triggerEmberBurst(x, y, amount = 16) {
      addSparks(x, y, 24);
      for (let i = 0; i < amount; i++) {
        const el = new DesertElement(false);
        el.type = 0; // Force glowing campfire ember
        el.x = x + (Math.random() - 0.5) * 30;
        el.y = y + (Math.random() - 0.5) * 30;
        const angle = Math.random() * Math.PI * 2;
        const speed = 3.0 + Math.random() * 6.5;
        el.vx = Math.cos(angle) * speed;
        el.vy = Math.sin(angle) * speed - 1.5;
        el.life = 1.0;
        el.size = 2.0 + Math.random() * 3.2;
        el.updateColor();
        elements.push(el);
      }

      if (elements.length > config.emberCount + 30) {
        elements.splice(0, amount);
      }
    }

    // ================= CONTROLS LOGIC =================
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const popover = document.getElementById('ambientPopover');
    const closeBtn = document.getElementById('closeControlsBtn');

    const windSpeedInput = document.getElementById('windSpeed');
    const emberDensityInput = document.getElementById('emberDensity');
    const moonlightRadianceInput = document.getElementById('moonlightRadiance');
    const toggleVortexBtn = document.getElementById('toggleVortexBtn');
    const triggerStormBtn = document.getElementById('triggerStormBtn');
    const paletteButtons = document.querySelectorAll('.palette-btn');

    function toggleMenu(show) {
      if (show) {
        popover.classList.remove('hidden');
        requestAnimationFrame(() => {
          popover.classList.remove('scale-95', 'opacity-0');
          popover.classList.add('scale-100', 'opacity-100');
        });
      } else {
        popover.classList.remove('scale-100', 'opacity-100');
        popover.classList.add('scale-95', 'opacity-0');
        setTimeout(() => popover.classList.add('hidden'), 250);
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = popover.classList.contains('hidden');
      toggleMenu(isClosed);
    });

    closeBtn.addEventListener('click', () => toggleMenu(false));

    // Wind Speed Slider
    windSpeedInput.addEventListener('input', (e) => {
      config.windFactor = parseFloat(e.target.value);
      document.getElementById('windVal').textContent =
        config.windFactor > 2.0 ? 'Desert Gale' : config.windFactor > 1.1 ? 'Night Wind' : 'Nocturnal Breeze';
    });

    // Ember Density Slider
    emberDensityInput.addEventListener('input', (e) => {
      config.emberCount = parseInt(e.target.value, 10);
      document.getElementById('densityVal').textContent = `${config.emberCount > 130 ? 'Blazing' : config.emberCount > 75 ? 'Campfire' : 'Sparse'} (${config.emberCount})`;
      syncElementCount();
    });

    // Moonlight Radiance Slider
    moonlightRadianceInput.addEventListener('input', (e) => {
      config.radianceFactor = parseFloat(e.target.value);
      document.getElementById('radianceVal').textContent =
        config.radianceFactor > 1.8 ? 'Full Moon' : config.radianceFactor > 1.0 ? 'Luminescent' : 'Deep Twilight';
    });

    // Scent Palette Switcher
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => {
          b.classList.remove('active', 'border-blue-500/80', 'bg-blue-950/40', 'text-white', 'shadow-sm');
          b.classList.add('border-slate-700/60', 'bg-slate-900/40', 'text-slate-400');
        });
        btn.classList.add('active', 'border-blue-500/80', 'bg-blue-950/40', 'text-white', 'shadow-sm');
        btn.classList.remove('border-slate-700/60', 'bg-slate-900/40', 'text-slate-400');

        config.activePalette = btn.getAttribute('data-palette');
        elements.forEach(el => el.updateColor());
      });
    });

    // Wind Dynamics Vortex Toggle
    toggleVortexBtn.addEventListener('click', () => {
      config.isVortexActive = !config.isVortexActive;
      toggleVortexBtn.textContent = config.isVortexActive ? 'Desert Vortex' : 'Direct Gust';
      toggleVortexBtn.classList.toggle('border-blue-500/50');
      toggleVortexBtn.classList.toggle('border-amber-500/50');
    });

    // Ember Storm Button
    triggerStormBtn.addEventListener('click', () => {
      triggerEmberBurst(width * 0.5, height * 0.65, 30);
      elements.forEach(el => {
        el.vy = -3.5 - Math.random() * 5.5;
        el.vx = (Math.random() - 0.5) * 8.0;
      });
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
        toggleMenu(false);
      }
    });

    window.addEventListener('resize', resize);

    window.onload = function() {
      resize();
      render();
    };
  </script>
</body>
</html>
