  <!-- ================= SIMULATION LOGIC ================= -->
  <script>
    lucide.createIcons();

    const canvas = document.getElementById('blossomCanvas');
    const ctx = canvas.getContext('2d');

    const shimmerCanvas = document.getElementById('shimmerCanvas');
    const shimmerCtx = shimmerCanvas.getContext('2d');

    const ambientGlow = document.getElementById('ambientGlow');

    let width = 0;
    let height = 0;

    // Simulation Configuration
    const config = {
      blossomCount: 38,
      shimmerCount: 65,
      speedFactor: 0.9,
      shimmerFactor: 1.3,
      mouseRepelRadius: 200,
      swirlForce: 1.5,
      isVortexActive: true,
      windX: 0.3,
      windY: 0.38,
      activePalette: 'sunlitPeach'
    };

    // Color Profiles for Light, Radiant Fruit & Floral Elements
    const palettes = {
      sunlitPeach: {
        glow: 'rgba(255, 188, 160, 0.45)',
        core: '#f7b469',
        petals: [
          { fill: '#ffffff', stroke: '#ffe6d5', shadow: '#ffbca0' },
          { fill: '#fff3ea', stroke: '#ffd4be', shadow: '#fa9d79' },
          { fill: '#ffe6d5', stroke: '#ffbca0', shadow: '#ed7f56' },
          { fill: '#ffdfce', stroke: '#ffd4be', shadow: '#f7b469' }
        ],
        sparkleColors: ['#ffffff', '#fcd36c', '#ffd4be', '#ffbca0', '#ffe7a3']
      },
      apricotCream: {
        glow: 'rgba(247, 180, 105, 0.45)',
        core: '#e59542',
        petals: [
          { fill: '#ffffff', stroke: '#ffcf94', shadow: '#f7b469' },
          { fill: '#fff6ed', stroke: '#ffe2bd', shadow: '#ffcf94' },
          { fill: '#ffe9d6', stroke: '#ffcf94', shadow: '#e59542' },
          { fill: '#fff3ea', stroke: '#ffd4be', shadow: '#f7b469' }
        ],
        sparkleColors: ['#ffffff', '#ffcf94', '#f7b469', '#fff4ec']
      },
      neroliDawn: {
        glow: 'rgba(255, 231, 163, 0.55)',
        core: '#f0bb3b',
        petals: [
          { fill: '#ffffff', stroke: '#fff8ea', shadow: '#ffe7a3' },
          { fill: '#fffdf5', stroke: '#ffeec2', shadow: '#fcd36c' },
          { fill: '#fff8ea', stroke: '#ffd4be', shadow: '#ffe7a3' },
          { fill: '#ffffff', stroke: '#ffe6d5', shadow: '#ffd4be' }
        ],
        sparkleColors: ['#ffffff', '#ffe7a3', '#fcd36c', '#fffaf6']
      },
      coralChiffon: {
        glow: 'rgba(250, 157, 121, 0.45)',
        core: '#f7b469',
        petals: [
          { fill: '#fff1eb', stroke: '#ffbca0', shadow: '#fa9d79' },
          { fill: '#ffe6dc', stroke: '#fa9d79', shadow: '#ed7f56' },
          { fill: '#ffffff', stroke: '#ffd4be', shadow: '#fa9d79' },
          { fill: '#ffdacf', stroke: '#fa9d79', shadow: '#e59542' }
        ],
        sparkleColors: ['#ffffff', '#fa9d79', '#ffd4be', '#ffe2bd']
      }
    };

    // Cursor Tracking
    const mouse = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      targetX: window.innerWidth / 2,
      targetY: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      isDown: false
    };

    // ================= PEACH / NEROLI BLOSSOM & CURVED PETAL CLASS =================
    class PeachBlossomElement {
      constructor(isInitial = false) {
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        this.x = isInitial ? Math.random() * width : Math.random() * width * 1.3 - width * 0.15;
        this.y = isInitial ? Math.random() * height : -70 - Math.random() * 70;

        // Either a full 5-petal peach/neroli blossom or an individual delicate petal
        this.isFullBlossom = Math.random() > 0.52;

        this.depth = 0.5 + Math.random() * 0.9;
        this.baseSize = (this.isFullBlossom ? 12 + Math.random() * 13 : 8 + Math.random() * 11) * this.depth;
        this.size = this.baseSize;

        // 3D tumble & flutter
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.022;
        this.flip = Math.random() * Math.PI;
        this.flipSpeed = 0.012 + Math.random() * 0.024;

        this.vx = (0.2 + Math.random() * 0.55) * this.depth;
        this.vy = (0.35 + Math.random() * 0.75) * this.depth;

        this.opacity = (0.7 + Math.random() * 0.28) * (this.depth > 1 ? 0.95 : 0.85);
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.014 + Math.random() * 0.02;

        this.updateColor();
      }

      updateColor() {
        const pal = palettes[config.activePalette];
        this.colorSet = pal.petals[Math.floor(Math.random() * pal.petals.length)];
        this.coreColor = pal.core;
      }

      update() {
        this.swayPhase += this.swaySpeed * config.speedFactor;
        this.angle += this.angularSpeed * config.speedFactor;
        this.flip += this.flipSpeed * config.speedFactor;

        const sway = Math.sin(this.swayPhase) * (1.2 * this.depth);
        this.x += (this.vx * config.speedFactor + config.windX + sway);
        this.y += (this.vy * config.speedFactor + config.windY);

        // Distance to cursor
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < config.mouseRepelRadius) {
          const normDist = (1 - dist / config.mouseRepelRadius);

          if (config.isVortexActive) {
            // Magnetic peach vortex around cursor
            const angle = Math.atan2(dy, dx);
            const tangentAngle = angle + Math.PI / 2;
            const push = normDist * 3.8 * this.depth;
            const swirl = normDist * 2.8 * this.depth * config.swirlForce;

            this.x += Math.cos(angle) * push + Math.cos(tangentAngle) * swirl;
            this.y += Math.sin(angle) * push + Math.sin(tangentAngle) * swirl;
            this.angle += 0.05 * normDist;
          } else {
            // Gentle drift displacement
            const force = normDist * 4.2 * this.depth;
            const angle = Math.atan2(dy, dx);
            this.x += Math.cos(angle) * force;
            this.y += Math.sin(angle) * force;
          }
        }

        // Screen boundary wrapping
        if (this.y > height + 80 || this.x > width + 120 || this.x < -120) {
          this.reset(false);
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        const verticalFlip = Math.sin(this.flip);
        c.scale(1, Math.abs(verticalFlip) < 0.1 ? 0.1 : verticalFlip);

        c.globalAlpha = this.opacity;

        if (this.isFullBlossom) {
          // ================= 5-PETAL PEACH & NEROLI BLOSSOM =================
          const numPetals = 5;
          const petalLength = this.size;
          const petalWidth = this.size * 0.62;

          c.shadowColor = palettes[config.activePalette].glow;
          c.shadowBlur = 10 * this.depth;

          for (let p = 0; p < numPetals; p++) {
            c.save();
            c.rotate((p * Math.PI * 2) / numPetals);

            // Tender curved petal with soft apex
            c.beginPath();
            c.moveTo(0, 0);
            c.bezierCurveTo(petalWidth * 0.55, -petalLength * 0.28, petalWidth, -petalLength * 0.72, petalWidth * 0.2, -petalLength);
            c.quadraticCurveTo(0, -petalLength * 0.92, -petalWidth * 0.2, -petalLength);
            c.bezierCurveTo(-petalWidth, -petalLength * 0.72, -petalWidth * 0.55, -petalLength * 0.28, 0, 0);
            c.closePath();

            // Lighter gradient: creamy white apex to soft apricot-peach base
            const grad = c.createLinearGradient(0, 0, 0, -petalLength);
            grad.addColorStop(0, this.colorSet.shadow);
            grad.addColorStop(0.35, this.colorSet.stroke);
            grad.addColorStop(1, this.colorSet.fill);

            c.fillStyle = grad;
            c.fill();

            // Delicate inner vein
            c.beginPath();
            c.moveTo(0, 0);
            c.quadraticCurveTo(petalWidth * 0.04, -petalLength * 0.45, 0, -petalLength * 0.75);
            c.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            c.lineWidth = 0.6;
            c.stroke();

            c.restore();
          }

          // Golden Pistil Core
          c.beginPath();
          c.arc(0, 0, this.size * 0.16, 0, Math.PI * 2);
          c.fillStyle = this.coreColor;
          c.shadowColor = this.coreColor;
          c.shadowBlur = 8;
          c.fill();

          // Micro stamen dots
          for (let s = 0; s < 5; s++) {
            const rad = (s * Math.PI * 2) / 5;
            const dist = this.size * 0.25;
            c.beginPath();
            c.arc(Math.cos(rad) * dist, Math.sin(rad) * dist, 1.1, 0, Math.PI * 2);
            c.fillStyle = '#ffffff';
            c.fill();
          }

        } else {
          // ================= SINGLE TUMBLING PEACH PETAL =================
          c.beginPath();
          c.moveTo(0, -this.size * 0.92);
          c.bezierCurveTo(this.size * 0.8, -this.size * 0.55, this.size * 0.75, this.size * 0.6, 0, this.size);
          c.bezierCurveTo(-this.size * 0.75, this.size * 0.6, -this.size * 0.8, -this.size * 0.55, 0, -this.size * 0.92);
          c.closePath();

          const grad = c.createLinearGradient(-this.size * 0.35, -this.size * 0.75, this.size * 0.35, this.size * 0.75);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.4, this.colorSet.fill);
          grad.addColorStop(0.85, this.colorSet.stroke);
          grad.addColorStop(1, this.colorSet.shadow);

          c.fillStyle = grad;
          c.shadowColor = this.colorSet.shadow;
          c.shadowBlur = 8 * this.depth;
          c.fill();

          // Subtle vein
          c.beginPath();
          c.moveTo(0, -this.size * 0.68);
          c.quadraticCurveTo(this.size * 0.06, 0, 0, this.size * 0.75);
          c.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          c.lineWidth = 0.5;
          c.stroke();
        }

        c.restore();
      }
    }

    // ================= SUNLIT GOLDEN SHIMMER & NECTAR DROPLETS =================
    class ShimmerDrop {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 0.8 + Math.random() * 2.5;
        this.alpha = 0.3 + Math.random() * 0.65;
        this.pulse = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.02 + Math.random() * 0.04;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -0.2 - Math.random() * 0.45;

        const pal = palettes[config.activePalette];
        this.color = pal.sparkleColors[Math.floor(Math.random() * pal.sparkleColors.length)];
      }

      update() {
        this.pulse += this.pulseSpeed * config.shimmerFactor;
        this.y += this.vy * config.shimmerFactor;
        this.x += this.vx * config.shimmerFactor;

        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          const angle = Math.atan2(dy, dx);
          this.x += Math.cos(angle) * 1.6;
          this.y += Math.sin(angle) * 1.6;
        }

        if (this.y < -20 || this.x < -10 || this.x > width + 10) {
          this.reset();
          this.y = height + 10;
        }
      }

      draw(c) {
        const curAlpha = Math.max(0, (Math.sin(this.pulse) * 0.5 + 0.5) * this.alpha);
        c.save();
        c.globalAlpha = curAlpha;
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 8;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // ================= INTERACTIVE CURSOR SPARKLE TRAIL =================
    const stardustTrail = [];
    function addStardust(x, y, count = 1) {
      const pal = palettes[config.activePalette];
      for (let i = 0; i < count; i++) {
        if (stardustTrail.length > 60) stardustTrail.shift();
        stardustTrail.push({
          x: x + (Math.random() - 0.5) * 24,
          y: y + (Math.random() - 0.5) * 24,
          radius: 1.2 + Math.random() * 2.8,
          color: pal.sparkleColors[Math.floor(Math.random() * pal.sparkleColors.length)],
          life: 1.0,
          decay: 0.024 + Math.random() * 0.026
        });
      }
    }

    let blossoms = [];
    let shimmers = [];

    function syncBlossomCount() {
      if (blossoms.length < config.blossomCount) {
        while (blossoms.length < config.blossomCount) {
          blossoms.push(new PeachBlossomElement(false));
        }
      } else if (blossoms.length > config.blossomCount) {
        blossoms.splice(config.blossomCount);
      }
    }

    function resize() {
      width = canvas.width = shimmerCanvas.width = window.innerWidth;
      height = canvas.height = shimmerCanvas.height = window.innerHeight;

      blossoms = Array.from({ length: config.blossomCount }, () => new PeachBlossomElement(true));
      shimmers = Array.from({ length: config.shimmerCount }, () => new ShimmerDrop());
    }

    // ================= MAIN RENDER LOOP =================
    function render() {
      mouse.vx = mouse.targetX - mouse.x;
      mouse.vy = mouse.targetY - mouse.y;
      mouse.x += mouse.vx * 0.1;
      mouse.y += mouse.vy * 0.1;

      // Update light peach bloom background
      if (ambientGlow) {
        const xPercent = (mouse.x / width) * 100;
        const yPercent = (mouse.y / height) * 100;
        ambientGlow.style.setProperty('--mouse-x', `${xPercent}%`);
        ambientGlow.style.setProperty('--mouse-y', `${yPercent}%`);
      }

      ctx.clearRect(0, 0, width, height);

      // Render peach blossoms & curved petals
      for (let i = 0; i < blossoms.length; i++) {
        blossoms[i].update();
        blossoms[i].draw(ctx);
      }

      // Render ascending sunlit shimmer droplets
      for (let i = 0; i < shimmers.length; i++) {
        shimmers[i].update();
        shimmers[i].draw(ctx);
      }

      // Render cursor particle trail
      shimmerCtx.clearRect(0, 0, width, height);
      for (let i = stardustTrail.length - 1; i >= 0; i--) {
        const pt = stardustTrail[i];
        pt.life -= pt.decay;
        if (pt.life <= 0) {
          stardustTrail.splice(i, 1);
          continue;
        }

        shimmerCtx.save();
        shimmerCtx.globalAlpha = pt.life * 0.95;
        shimmerCtx.fillStyle = pt.color;
        shimmerCtx.shadowColor = pt.color;
        shimmerCtx.shadowBlur = 10;
        shimmerCtx.beginPath();
        shimmerCtx.arc(pt.x, pt.y, pt.radius * pt.life, 0, Math.PI * 2);
        shimmerCtx.fill();
        shimmerCtx.restore();
      }

      requestAnimationFrame(render);
    }

    // ================= POINTER & TOUCH INTERACTIONS =================
    function handlePointer(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      mouse.targetX = clientX;
      mouse.targetY = clientY;

      addStardust(clientX, clientY, 1);

      if (mouse.isDown) {
        addStardust(clientX, clientY, 2);
      }
    }

    window.addEventListener('mousemove', handlePointer, { passive: true });
    window.addEventListener('touchmove', handlePointer, { passive: true });

    // Click/Tap to burst floral elements & stardust
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#ambientPopover, #toggleControlsBtn')) return;
      mouse.isDown = true;
      burstAt(e.clientX, e.clientY, 8);
    });

    window.addEventListener('mouseup', () => { mouse.isDown = false; });

    function burstAt(x, y, amount = 9) {
      addStardust(x, y, 16);
      for (let i = 0; i < amount; i++) {
        const b = new PeachBlossomElement(false);
        b.x = x + (Math.random() - 0.5) * 45;
        b.y = y + (Math.random() - 0.5) * 45;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 5.2;
        b.vx = Math.cos(angle) * speed;
        b.vy = Math.sin(angle) * speed;
        blossoms.push(b);
      }
      if (blossoms.length > config.blossomCount + 25) {
        blossoms.splice(0, amount);
      }
    }

    // ================= CONTROLS LOGIC =================
    const toggleBtn = document.getElementById('toggleControlsBtn');
    const popover = document.getElementById('ambientPopover');
    const closeBtn = document.getElementById('closeControlsBtn');

    const petalSpeedInput = document.getElementById('petalSpeed');
    const petalDensityInput = document.getElementById('petalDensity');
    const sparkleIntensityInput = document.getElementById('sparkleIntensity');
    const toggleSwirlBtn = document.getElementById('toggleSwirlBtn');
    const scatterBtn = document.getElementById('scatterPetalsBtn');
    const paletteButtons = document.querySelectorAll('.palette-btn');

    function toggleMenu(show) {
      if (show) {
        popover.classList.remove('hidden');
        requestAnimationFrame(() => {
          popover.classList.remove('scale-95', 'opacity-0');
          popover.classList.add('scale-100', 'opacity-100');
        });
      } else {
        popover.classList.remove('scale-100', 'opacity-100');
        popover.classList.add('scale-95', 'opacity-0');
        setTimeout(() => popover.classList.add('hidden'), 250);
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isClosed = popover.classList.contains('hidden');
      toggleMenu(isClosed);
    });

    closeBtn.addEventListener('click', () => toggleMenu(false));

    // Breeze Speed Slider
    petalSpeedInput.addEventListener('input', (e) => {
      config.speedFactor = parseFloat(e.target.value);
      document.getElementById('speedVal').textContent =
        config.speedFactor > 1.8 ? 'Fresh Gust' : config.speedFactor > 0.8 ? 'Gentle Breeze' : 'Languid';
    });

    // Blossom Density Slider
    petalDensityInput.addEventListener('input', (e) => {
      config.blossomCount = parseInt(e.target.value, 10);
      document.getElementById('densityVal').textContent = `${config.blossomCount > 55 ? 'Lush' : config.blossomCount > 30 ? 'Sumptuous' : 'Delicate'} (${config.blossomCount})`;
      syncBlossomCount();
    });

    // Shimmer & Peach Radiance Slider
    sparkleIntensityInput.addEventListener('input', (e) => {
      config.shimmerFactor = parseFloat(e.target.value);
      document.getElementById('shimmerVal').textContent =
        config.shimmerFactor > 1.9 ? 'Sunlit Brilliance' : config.shimmerFactor > 0.9 ? 'Luminous' : 'Soft Glow';
    });

    // Palette Switcher
    paletteButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteButtons.forEach(b => {
          b.classList.remove('active', 'border-peachcream-400', 'bg-white/80', 'text-neutral-800', 'shadow-sm');
          b.classList.add('border-transparent', 'bg-white/40', 'text-neutral-600');
        });
        btn.classList.add('active', 'border-peachcream-400', 'bg-white/80', 'text-neutral-800', 'shadow-sm');
        btn.classList.remove('border-transparent', 'bg-white/40', 'text-neutral-600');

        config.activePalette = btn.getAttribute('data-palette');
        blossoms.forEach(b => b.updateColor());
        shimmers.forEach(s => s.reset());
      });
    });

    // Toggle Vortex / Breeze Force
    toggleSwirlBtn.addEventListener('click', () => {
      config.isVortexActive = !config.isVortexActive;
      toggleSwirlBtn.textContent = config.isVortexActive ? 'Magnetic Vortex' : 'Gentle Drift';
      toggleSwirlBtn.classList.toggle('border-peachcream-500');
      toggleSwirlBtn.classList.toggle('bg-peachcream-200');
    });

    // Burst Action Button
    scatterBtn.addEventListener('click', () => {
      blossoms.forEach(b => {
        b.vx = (Math.random() - 0.5) * 11;
        b.vy = -3.2 - Math.random() * 6.5;
      });
      addStardust(width / 2, height / 2, 30);
    });

    // Close popover when clicking outside
    document.addEventListener('click', (e) => {
      if (!popover.contains(e.target) && !toggleBtn.contains(e.target)) {
        toggleMenu(false);
      }
    });

    window.addEventListener('resize', resize);

    window.onload = function() {
      resize();
      render();
    };
  </script>
</body>
</html>
